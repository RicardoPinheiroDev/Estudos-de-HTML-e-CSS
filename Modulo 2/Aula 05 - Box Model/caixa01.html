<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h1, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 { 
            background-color: lightgray;
            height: 300px;
            width: 300px;

            /* Centraliza a imagem no meio
            margin: auto; */ 

            /* Largura da borda -> estilo -> cor*/
            border: 10px solid darkslategray;
            /* Em cima -> na direita -> em baixo -> a esquerda*/
            padding: 10px 10px 10px 10px;

            /*cima-> direita -> baixo -> esquerda 
            margin: 10px 10px 10px 10px;*/ 
            
            /* Centralizamos as margens da direita e esquerda para o elemento ficar no centro*/
            margin: 10px auto 10px auto;

            /* largura -> estilo -> cor*/
            outline: 5px dashed salmon;
        }

        a {
            border: 10px groove red;
            padding: 10px 10px 10px 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level mas os <a href="">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona</p>
</body>
</html>
