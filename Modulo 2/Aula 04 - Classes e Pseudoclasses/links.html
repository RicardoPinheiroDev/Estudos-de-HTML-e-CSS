<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }


        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        /* Pseudoclasses sao palavras que definem estados de elementos dentro do html*/
        a:visited {
          color: darkred;  
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        /*Quando é clicado*/
        a:active {
            color: yellow;
        }

        .marcado {
            background-color: rgba(255, 0, 0, 0.486);
        }
        /* Pseudoelementos*/
        .marcado::before {
            content: '⇨ ';
        }
        .marcado::after {
            content: ' ⇦';
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/RicardoPinheiroDev" target="_blank" class="marcado">Repositorio do Github</a></li>
        <li><a href="https://www.youtube.com/@JRicardoPP03">Canal do Youtube</a></li>
    </ul>
</body>
</html>
