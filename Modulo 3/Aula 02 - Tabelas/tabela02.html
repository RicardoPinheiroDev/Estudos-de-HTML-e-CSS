<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        } 

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            
        }
   
        td {
            border:  1px solid black;
            padding: 8px;
            /* left -> center -> right*/
            text-align: center;
            /* top -> middle -> bottom*/
            vertical-align: bottom; 
        }

        .numero {
            text-align: right;
        }
        
    </style>
</head>
<body>

    <h1>Minha primeira tabela</h1>
    /* Hierarquia de tabelas 
    Table Row -> Linha de tabela
    Table header -> cabeçalho de tabela
    table data = dado de tabel */

    <Table>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
    
        <tr> 
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
        <tr>
            <td>A5</td>
            <td>B5</td>
            <td>C5</td>
        </tr>
    </Table>
    
</body>
</html>
