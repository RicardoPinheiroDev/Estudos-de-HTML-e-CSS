<body>
    <h1> Forum Testing</h1>

    <form action="teste.html" method="POST" autocomplete="on">
        <P>
            <label for="i-utilizador">Utilizador:</label>
            <input type="text" name="utilizador" id=" i-utilizador" required minlength="5" maxlength="30" size="10" placeholder="Nome do utilizador" autocomplete="username">
        </P>

        <p>
            <label for="i-password">Senha: </label>
            <input type="password" name="password" required minlength="8" maxlength="20" placeholder="minimo 8 letras" autocomplete="current-password">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
