<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div > p {
            display: none;
        }
        div:hover >p {
            display: block;
            color: white;
            background-color: red;
            width: 300px
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o rato sobre o texto abaixo</p>
    <div>
        Passe o rato agora 
        <p> Texto escondido</p>
    </div>
</body>
</html>
